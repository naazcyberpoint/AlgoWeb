[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algoweb"
version = "0.1.0"
description = "Algorithmic Trading Platform Production Monorepo"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AlgoWeb Architecture Team", email = "architecture@algoweb.internal" }
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
